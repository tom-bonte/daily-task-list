<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Updating Habits Rabbits…</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; display: grid; place-content: center; min-height: 100vh; margin: 0; text-align: center; color: #0b0b0b; background: #f5f5f2; }
    @media (prefers-color-scheme: dark) { body { color: #fff; background: #0d0d0d; } }
    p { color: #7a7872; }
  </style>
</head>
<body>
  <!-- Escape hatch: this page is never cached, so it always loads fresh even
       when an old service worker is still serving the app. It clears that
       worker and every cache, then returns to the app. -->
  <h1>Updating…</h1>
  <p id="status">Clearing the offline cache.</p>
  <script>
    (async () => {
      try {
        const workers = await navigator.serviceWorker?.getRegistrations() ?? [];
        await Promise.all(workers.map(w => w.unregister()));
        const names = await caches.keys();
        await Promise.all(names.map(n => caches.delete(n)));
        document.getElementById('status').textContent = `Removed ${workers.length} worker(s) and ${names.length} cache(s). Reloading…`;
      } catch (err) {
        document.getElementById('status').textContent = 'Could not clear everything: ' + err.message;
      }
      setTimeout(() => location.replace('./?updated=1'), 700);
    })();
  </script>
</body>
</html>
