<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habits Rabbits</title>
  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/webp" href="favicon.webp">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Habits Rabbits">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav id="tabs" aria-label="Sections">
    <div class="brand"><img class="brand-mark" src="icon-192.png" alt="" width="26" height="26">Habits Rabbits</div>
    <button data-action="view" data-view="day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4M9 15l2 2 4-4"/></svg>
      <span>Day</span><kbd>1</kbd>
    </button>
    <button data-action="view" data-view="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>
      <span>Stats</span><kbd>2</kbd>
    </button>
    <button data-action="view" data-view="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span>Search</span><kbd>3</kbd>
    </button>
    <button data-action="view" data-view="backlog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 13.5h5l1.5 2.5h4l1.5-2.5h5"/><path d="M5.5 5.5h13l2 8v5a1.5 1.5 0 0 1-1.5 1.5h-14a1.5 1.5 0 0 1-1.5-1.5v-5z"/></svg>
      <span>Wachtruimte</span><kbd>4</kbd>
    </button>
    <button data-action="view" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Settings</span><kbd>5</kbd>
    </button>
    <div class="nav-foot" id="nav-foot"></div>
  </nav>
  <div id="runbar" hidden></div>
  <div class="shell">
    <main id="view"><div class="loading">Loading…</div></main>
  </div>
  <dialog id="sheet" aria-label="Edit task"></dialog>
  <div id="tip" role="tooltip"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="ask" role="alertdialog" aria-live="polite"></div>
  <div id="banner" role="status" aria-live="polite"></div>
  <!-- Optional: paste a reCAPTCHA v3 site key to enable Firebase App Check. -->
  <script>window.APP_CHECK_KEY = "";</script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
